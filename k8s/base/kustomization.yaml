apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-hub

resources:
  - namespace.yaml
  - content-api.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: content-hub
      app.kubernetes.io/managed-by: kustomize
    # Selectors are immutable on a Deployment — adding a label to them would
    # make every future change require deleting the Deployment first.
    includeSelectors: false
