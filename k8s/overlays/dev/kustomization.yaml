apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-hub

resources:
- ../../base
# The AGC route and health policies. Dev only: DR is fronted by ingress-nginx.
- agc-routes.yaml

# The registry name comes from the dev landing zone's `acr_login_server` output.
# CI overwrites the tags in place with:
#   kustomize edit set image content-api=<server>/content-hub/content-api:<sha>
#
# Tags are immutable git SHAs, never `latest`: a mutable tag makes a rollout
# unreproducible and defeats `kubectl rollout undo`.
images:
- name: backend
  newName: acrdevvinorg001.azurecr.io/content-hub/backend
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632
- name: content-api
  newName: acrdevvinorg001.azurecr.io/content-hub/content-api
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632
- name: frontend
  newName: acrdevvinorg001.azurecr.io/content-hub/frontend
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632

# Images always come from the registry in the cluster — IfNotPresent would let
# a stale node-cached layer win when a tag is ever reused.
patches:
- patch: |
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
  target:
    kind: Deployment

# Lets this namespace's routes attach to the shared Gateway, whose listener only
# accepts namespaces carrying this label. Dev only, as above.
#
# It is applied here for now because this repository still creates the namespace.
# Once Content Hub moves to its own repository the PLATFORM should set it when it
# creates the namespace — a tenant that can label its own namespace can grant
# itself access, and that decision is not the tenant's to make.
- patch: |
    - op: add
      path: /metadata/labels/gateway-access
      value: shared
  target:
    kind: Namespace
    name: content-hub
