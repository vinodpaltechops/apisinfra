# SHARED dev settings for Content Hub: the image pins and the pull policy. It
# declares no entrance and is not deployed directly. Content Hub reaches the
# outside world by one of two routes, each its own overlay built on this one:
#
#   ../dev-agc     the shared AGC Gateway (HTTPRoute)      workload content-hub-agc
#   ../dev-nginx   the internal ingress-nginx (Ingress)    workload content-hub-nginx
#
# The image tags live HERE and only here, so app-deploy's `kustomize edit set
# image` in this directory updates both routes at once and needs to know about
# neither.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-hub

resources:
- ../../base

# The registry name comes from the dev landing zone's `acr_login_server` output.
# CI overwrites the tags in place with:
#   kustomize edit set image content-api=<server>/content-hub/content-api:<sha>
#
# Tags are immutable git SHAs, never `latest`: a mutable tag makes a rollout
# unreproducible and defeats `kubectl rollout undo`.
images:
- name: backend
  newName: acrdevvinorg001.azurecr.io/content-hub/backend
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632
- name: content-api
  newName: acrdevvinorg001.azurecr.io/content-hub/content-api
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632
- name: frontend
  newName: acrdevvinorg001.azurecr.io/content-hub/frontend
  newTag: faef27cec67e9ea25990b836c8c74140ae51b632

# Images always come from the registry in the cluster — IfNotPresent would let
# a stale node-cached layer win when a tag is ever reused.
patches:
- patch: |
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
  target:
    kind: Deployment
