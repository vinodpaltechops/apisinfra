# Content Hub's own entry on the shared AGC Gateway. This is the part an
# application repository owns: the platform provides the Gateway, this file says
# which hostname and paths reach which Services.
#
# Dev overlay only. The DR cluster has no Gateway API or ALB CRDs (it is fronted
# by ingress-nginx), so putting these in base would fail its sync.
#
# Same routing as k8s/base/ingress.yaml: /api to the BFF, everything else to the
# SPA. The most specific prefix wins, and there is no rewrite — the backend
# already serves /api/v1/... at that exact path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: content-hub
spec:
  parentRefs:
    # kustomize's namespace transformer sets metadata.namespace but never reaches
    # into a reference, so the Gateway's namespace is spelled out.
    - name: shared
      namespace: platform-gateway
  # Claimed, not empty. On a shared Gateway an empty list matches EVERY host, so
  # this route would answer for any name no other route has claimed — including
  # a future app's, depending on which attaches first.
  #
  # The raw *.alb.azure.com frontend name therefore no longer serves the app; use
  # app.sometestdemo.in, or send `Host: app.sometestdemo.in` when testing.
  hostnames:
    - app.sometestdemo.in
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
---
# AGC probes "/" by default and treats anything outside 200-399 as unhealthy.
# The BFF has no route at "/", so without these the backend would be marked
# Unhealthy while every pod is Ready. /healthz is the liveness path, which does
# not call content-api (/readyz does), so a downstream outage cannot take the
# whole backend out of the gateway.
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: frontend
spec:
  targetRef:
    group: ""
    kind: Service
    name: frontend
    namespace: content-hub
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 8080
    http:
      path: /healthz
      match:
        statusCodes:
          - start: 200
            end: 299
---
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: backend
spec:
  targetRef:
    group: ""
    kind: Service
    name: backend
    namespace: content-hub
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 8000
    http:
      path: /healthz
      match:
        statusCodes:
          - start: 200
            end: 299
