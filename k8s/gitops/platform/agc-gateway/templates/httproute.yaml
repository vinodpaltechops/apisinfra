# Same routing as k8s/base/ingress.yaml: /api to the BFF, everything else to the
# SPA. The most specific prefix wins, and there is no rewrite — the backend
# already serves /api/v1/... at that exact path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: content-hub
spec:
  parentRefs:
    - name: content-hub
  {{- with .Values.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.backend.service }}
          port: {{ .Values.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.frontend.service }}
          port: {{ .Values.frontend.port }}
