# AGC probes "/" by default and treats anything outside 200-399 as unhealthy.
# The BFF has no route at "/", so without these the backend would be marked
# Unhealthy while every pod is Ready. /healthz is the liveness path, which does
# not call content-api (/readyz does), so a downstream outage cannot take the
# whole backend out of the gateway.
{{- range $svc := list .Values.frontend .Values.backend }}
---
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $svc.service }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ $svc.service }}
    namespace: {{ $.Release.Namespace }}
  default:
    interval: 5s
    timeout: 3s
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: {{ $svc.port }}
    http:
      path: {{ $.Values.healthPath }}
      match:
        statusCodes:
          - start: 200
            end: 299
{{- end }}
