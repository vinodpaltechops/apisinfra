# Every Azure identifier below comes from the agc Terraform layer, injected by
# the agc-gateway ApplicationSet from the in-cluster Argo CD secret's
# annotations. The empty strings are deliberate: they make `helm template`
# render, and the `required` calls in the templates fail loudly if the
# ApplicationSet forgot to fill one in.

# Resource ID of the AGC (output agc_id). Goes in the Gateway annotation.
albId: ""
# Name of the AGC frontend (output frontend_name).
frontendName: ""
# Source range of the gateway's traffic (output agc_subnet_cidr) — what the
# NetworkPolicies let through to the pods. AGC's data plane is not a pod, so a
# podSelector/namespaceSelector can never describe it.
subnetCidr: ""

# ── The platform contract ─────────────────────────────────────────────────────
# What an application repository needs to publish through this gateway:
#   1. attach its HTTPRoute with
#        parentRefs: [{ name: <gateway.name>, namespace: platform-gateway }]
#   2. deploy into a namespace listed in tenantNamespaces below, which the
#      platform also labels <accessLabel>=<accessValue>
#   3. claim its own hostnames — never leave `hostnames` empty on a shared
#      gateway, or the route swallows every host nobody else has claimed.
gateway:
  name: shared
  # The label a namespace must carry before its routes may attach. Set by the
  # platform (managedNamespaceMetadata for this namespace, the overlay for a
  # tenant) — never by the tenant, or it grants itself access.
  accessLabel: gateway-access
  accessValue: shared

# Namespaces that receive the AGC NetworkPolicy door from THIS chart. Empty on
# purpose: the platform deploys with no application, and listing a namespace that
# does not exist fails that object's sync and leaves the Gateway Application
# degraded for no reason. An application that is deployed on demand (Content Hub)
# carries its own allow-agc policy in its manifests instead, using agc_subnet_cidr
# from the contract. Use this list only for a namespace the platform itself owns.
tenantNamespaces: []

# Platform-owned probe target. Traffic Manager sends this as the Host header
# (infra/platform/trafficmanager: health_hostname) — the two must match, and
# neither needs a DNS record, because Traffic Manager names the host itself.
health:
  hostname: health.sometestdemo.in
  image: nginxinc/nginx-unprivileged:1.27-alpine
