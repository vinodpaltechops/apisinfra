apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velero

resources:
  - ../../base

# ── Offset the DR cluster's schedules from the primary's ──────────────────────
# Both clusters write into the SAME storage account. Running their backups at
# the same minute means two Kopia uploads competing for the same account's
# throughput, on two single-node clusters that each have 2 vCPU to spare between
# the backup and the application.
#
# Offsetting by ~20 minutes costs nothing and keeps each upload alone on the
# wire. It also makes the two clusters' backups trivially distinguishable by
# timestamp when reading the container.
patches:
  - target:
      kind: Schedule
      name: hourly-content-hub
    patch: |
      - op: replace
        path: /spec/schedule
        value: "37 * * * *"

  - target:
      kind: Schedule
      name: daily-full
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 3 * * *"
