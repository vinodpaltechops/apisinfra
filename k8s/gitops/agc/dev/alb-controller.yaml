# ALB Controller — PRIMARY cluster.
#
# The in-cluster half of Application Gateway for Containers: it watches Gateway
# and HTTPRoute objects and programs the AGC that Terraform created. It carries
# no traffic.
#
# An ApplicationSet, not an Application, for the same reason as velero.yaml: the
# identity's client id is a Terraform output, read from the annotations that
# argocd-bootstrap writes onto this cluster's Argo CD secret, so it never has to
# be typed into Git.
#
# Sync wave -1: the controller must be running (and its CRDs and GatewayClass
# installed) before the Gateway in agc-gateway.yaml (wave 0) is applied.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alb-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  # A missing annotation fails the render instead of producing an empty client
  # id, which would install cleanly and then fail every token exchange.
  goTemplateOptions: ["missingkey=error"]

  generators:
    - clusters:
        selector:
          matchLabels:
            gitops.vinorg/cluster: dev

  template:
    metadata:
      name: alb-controller
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: mcr.microsoft.com/application-lb/charts
        chart: alb-controller
        # Pinned. The controller and the Gateway API CRDs it ships move together;
        # an unpinned chart upgrades both under a running gateway.
        targetRevision: 1.12.4
        helm:
          releaseName: alb-controller
          valuesObject:
            albController:
              # Both values below are what the Terraform federated credential
              # trusts: system:serviceaccount:azure-alb-system:alb-controller-sa.
              # Change either and token exchange fails with AADSTS70025.
              namespace: azure-alb-system
              podIdentity:
                # CLIENT id, not principal id.
                clientID: '{{ .metadata.annotations.albClientId }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: azure-alb-system

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 20s
            factor: 2
            maxDuration: 3m
