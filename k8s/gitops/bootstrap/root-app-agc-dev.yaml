# ROOT APPLICATION for the AGC (Application Gateway for Containers) pieces —
# PRIMARY cluster only.
#
# Separate from root-dev on purpose, while AGC is still being proven on `dev`
# before it reaches `main`. root-dev now reads k8s/gitops/apps/dev from `dev` as
# well, so the two could be folded together; they are kept apart so the AGC
# pieces can be added or dropped as a unit, without touching the rest of the
# cluster's Application list. This one reads k8s/gitops/agc/dev.
#
# WHEN DEV IS MERGED TO MAIN:
#   1. git mv k8s/gitops/agc/dev/* k8s/gitops/apps/dev/
#   2. in those files change targetRevision from `dev` back to `main`
#   3. delete this file and its apply step in argocd-bootstrap.yml
# Leaving this in place works, but it keeps tracking `dev` after dev has stopped
# being where changes are proven.
#
# Applied by the argocd-bootstrap workflow (dev cluster only), after root-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-agc-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/vinodpaltechops/apisinfra.git
    targetRevision: dev
    path: k8s/gitops/agc/dev
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
