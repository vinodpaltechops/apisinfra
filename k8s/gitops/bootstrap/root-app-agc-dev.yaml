# ROOT APPLICATION for the AGC (Application Gateway for Containers) pieces —
# PRIMARY cluster only.
#
# Separate from root-dev on purpose, for as long as AGC is being proven on the
# feat/agc-centralindia branch: root-dev reads k8s/gitops/apps/dev from `main`,
# so nothing added on this branch can reach the cluster through it. This one
# reads k8s/gitops/agc/dev from the BRANCH, which is the only way to test the
# gateway without merging first.
#
# WHEN THE BRANCH IS MERGED:
#   1. git mv k8s/gitops/agc/dev/* k8s/gitops/apps/dev/
#   2. in those files change targetRevision from the branch back to `main`
#   3. delete this file and its apply step in argocd-bootstrap.yml
# Leaving this in place after the merge works, but it would keep tracking a
# branch that no longer exists.
#
# Applied by the argocd-bootstrap workflow (dev cluster only), after root-dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-agc-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/vinodpaltechops/apisinfra.git
    targetRevision: feat/agc-centralindia
    path: k8s/gitops/agc/dev
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
