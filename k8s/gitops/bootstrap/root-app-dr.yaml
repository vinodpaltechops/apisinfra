# ROOT APPLICATION (app-of-apps) — DR cluster, aks-dr-lab-001.
#
# The DR cluster's only root Application. The dev cluster has none: its platform
# components and applications are deployed on demand (k8s/gitops/components and
# k8s/gitops/workloads), because dev is a platform you assemble. DR is a warm
# standby and must converge on the primary's workloads by itself, so it keeps a
# root app that syncs the whole of k8s/gitops/apps/dr.
#
# Two independent Argo CD instances, one repo, no hub.
#
# Because this cluster converges on the repo by itself, a failover requires no
# deployment action. The DR cluster is already running the same commit as the
# primary before the incident starts — which is what makes the RTO the DNS/Front
# Door failover time rather than a redeploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/vinodpaltechops/apisinfra.git
    targetRevision: main
    path: k8s/gitops/apps/dr
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
