# Internal ingress controller — DR cluster.
#
# Same chart and version as the primary; only the values file differs
# (values-dr.yaml carries this region's subnet name and static VIP).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      # MUST match the primary's pin. Different ingress versions across regions
      # is a difference that only shows up under failover traffic.
      targetRevision: 4.12.0
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/k8s/platform/ingress-nginx-values-dr.yaml
    - repoURL: https://github.com/vinodpaltechops/apisinfra.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
