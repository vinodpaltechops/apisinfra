# Internal ingress controller — PRIMARY cluster.
#
# Replaces the one-shot `aks-platform-bootstrap` workflow for this cluster: the
# same chart, the same values file, now reconciled continuously instead of
# whenever somebody remembers to re-run the pipeline.
#
# The values file is the EXISTING k8s/platform/ingress-nginx-values.yaml,
# unchanged and still used by that workflow. Nothing was moved, so the old path
# stays available as a fallback while Argo CD is being proven.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source: the chart comes from the upstream Helm repo, the values from
  # this Git repo. The `$values` reference below resolves against the source
  # marked `ref: values`. Requires Argo CD >= 2.6.
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      # Pinned, matching INGRESS_NGINX_VERSION in aks-platform-bootstrap.yml.
      # An unpinned chart makes the two clusters silently diverge the first time
      # upstream publishes a release between their syncs.
      targetRevision: 4.12.0
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/k8s/platform/ingress-nginx-values.yaml
    - repoURL: https://github.com/vinodpaltechops/apisinfra.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      # The controller's admission webhook needs its Service endpoints ready
      # before the first Ingress can be admitted; on a cold cluster the initial
      # sync can lose that race and fail once.
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
