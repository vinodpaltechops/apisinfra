# The shared Gateway, the platform health route and the per-tenant NetworkPolicy
# doors — PRIMARY cluster.
#
# Lands in its OWN namespace, not an application's: the Gateway is platform
# infrastructure and must outlive, and not depend on, any app deployed behind it.
# Applications attach their own HTTPRoute from their own namespace. The existing
# Ingress and ingress-nginx are untouched.
#
# The Azure identifiers (AGC id, frontend name, gateway subnet range) come from
# the agc Terraform layer through the cluster secret's annotations.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agc-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - clusters:
        selector:
          matchLabels:
            gitops.vinorg/cluster: dev

  template:
    metadata:
      name: agc-gateway
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: https://github.com/vinodpaltechops/apisinfra.git
        # `dev`, the same branch as the wrapper Application that deploys this
        # (k8s/gitops/components/dev/agc.yaml), so the pieces move together.
        # Back to `main` once dev is merged.
        targetRevision: dev
        path: k8s/gitops/platform/agc-gateway
        helm:
          releaseName: agc-gateway
          valuesObject:
            albId: '{{ .metadata.annotations.agcId }}'
            frontendName: '{{ .metadata.annotations.agcFrontendName }}'
            subnetCidr: '{{ .metadata.annotations.agcSubnetCidr }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: platform-gateway

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Argo creates the namespace, so the labels have to come from here — a
        # kubectl label would be reverted by selfHeal. gateway-access is what the
        # Gateway's own health route needs in order to attach (see
        # gateway.accessLabel in the chart), and the Pod Security labels match
        # the content-hub namespace: everything in it already runs non-root.
        managedNamespaceMetadata:
          labels:
            gateway-access: shared
            app.kubernetes.io/part-of: platform-gateway
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          # The Gateway is rejected until the controller's CRDs exist and its
          # pod is up; on a cold cluster the first sync can lose that race.
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
