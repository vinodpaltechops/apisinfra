# Helm values for ingress-nginx as an INTERNAL controller.
#
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     -f k8s/platform/ingress-nginx-values.yaml
#
# Run this from the jump VM — the API server is private, and the Helm chart
# pulls from registry.k8s.io, which the VM reaches through the spoke NAT
# gateway (AKS nodes use their own LB egress).
#
# The Service gets a private frontend IP from snet-aks-user-dev (10.1.2.0/24)
# instead of a public one. The AKS control-plane identity already holds Network
# Contributor on the spoke VNet, so it can allocate that IP.

# ── The platform contract (nginx) ─────────────────────────────────────────────
# What an application needs to publish through this controller. The AGC
# equivalent is the contract block in k8s/gitops/platform/agc-gateway/values.yaml.
#
#   Reachable   The controller itself is INTERNAL: a private load balancer at
#               10.1.2.250 in snet-aks-user-dev, no public address. From inside the
#               VNet (the mgmt VM, the jump network, peered networks) it is reachable
#               directly. From the internet it is reachable ONLY through the App
#               Gateway (infra/platform/appgw, behind a WAF), which forwards to that
#               address. Keep it in step with the Service annotation below and with
#               var.ingress_internal_ip in infra/platform/appgw.
#   Declare     an Ingress with  ingressClassName: nginx-internal
#   Hostnames   claim your own `host:`. A rule with no host is a catch-all for every
#               name nobody else claimed, so at most one app should have one.
#               Content Hub has one today, because it is reached by IP.
#   Pods        a namespace with a default-deny needs a NetworkPolicy admitting the
#               ingress-nginx namespace (kubernetes.io/metadata.name=ingress-nginx)
#               on the app's ports. See allow-ingress-controller in
#               k8s/base/networkpolicy.yaml.
#   Namespace   no label or approval. Unlike the AGC Gateway, nothing gates which
#               namespaces may publish: any namespace's Ingress is served, so any
#               tenant can claim any host.
#   TLS         none. Plain HTTP; apps set ssl-redirect "false". Terminating TLS here
#               needs a certificate Secret per Ingress, which is not set up.
#   Public?     Through the App Gateway, and only for ONE hostname: its listener is
#               bound to app_fqdn (app.sometestdemo.in), so it fronts the same name
#               AGC serves and no other. A second public nginx hostname needs that
#               module changed. Traffic Manager ranks it above AGC and probes it on
#               the app's own hostname, so it takes traffic only while an nginx app
#               really answers there. WAF_v2 bills hourly whether or not one does.
#
# Choose by what the app needs. AGC is the public, managed entrance with an access
# gate on who may publish. nginx is the private one, for internal services and for
# apps or charts built around Ingress and nginx annotations.

controller:
  # A distinct class name, not the default "nginx". Naming it for what it is
  # leaves room for a second, public controller later without a collision.
  ingressClassResource:
    name: nginx-internal
    enabled: true
    default: false
    controllerValue: "k8s.io/ingress-nginx-internal"
  ingressClass: nginx-internal

  # ONE replica, deliberately. The chart auto-creates a PodDisruptionBudget as
  # soon as replicaCount > 1, and a PDB on a single-node pool makes that node
  # undrainable (see k8s/base/content-api.yaml for the full mechanism) — it
  # blocks node pool deletion and AKS upgrades alike.
  #
  # Two replicas bought nothing here anyway: both landed on the same node, so
  # they shared its fate. Raise this to 2 when the user pool has 2+ nodes, and
  # re-enable the app PDBs at the same time.
  replicaCount: 1

  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      # Pin the frontend IP to the AKS user subnet. Without this the LB picks
      # the subnet of the first node pool, which happens to be the same here —
      # but relying on that is how a subnet change silently moves your VIP.
      service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks-user-dev"
      # STATIC private VIP. Application Gateway's backend pool points at this
      # literal address (infra/platform/appgw), so it must not change when the
      # Service is recreated — a dynamically assigned VIP would silently leave
      # the gateway pointing at nothing after any teardown/rebuild.
      #
      # Chosen high in snet-aks-user-dev (10.1.2.0/24) to stay clear of node
      # IPs, which Azure hands out from the bottom (.4, .5, ...). Keep this in
      # sync with ingress_internal_ip in infra/platform/appgw.
      service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.1.2.250"
    externalTrafficPolicy: Local # preserves the client IP in access logs

  # Both replicas land on the single user node today; keep it soft so the
  # second one schedules instead of sitting Pending.
  nodeSelector:
    nodepool-type: user

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: controller

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi

  config:
    # Real client IPs in the logs, forwarded from the internal LB.
    use-forwarded-headers: "true"
    proxy-body-size: "1m"
    # Off by default in this chart, but be explicit: server tokens leak the
    # exact nginx version to anything that can reach the private IP.
    server-tokens: "false"

  metrics:
    # No Prometheus in this cluster — Container Insights scrapes container
    # stdout/stats instead. Turn this on if you add a Prometheus stack.
    enabled: false

  admissionWebhooks:
    enabled: true
    patch:
      nodeSelector:
        nodepool-type: user

defaultBackend:
  # The app's own ingress has a catch-all "/" rule, so nothing ever falls
  # through to a default backend. Skipping it saves a pod on a 2 vCPU node.
  enabled: false
