# AKS PLATFORM BOOTSTRAP — one-time (and idempotent) in-cluster prerequisites.
#
# Right now that means the INTERNAL ingress-nginx controller that app-deploy's
# Ingress object depends on. Run this once after the dev landing zone is
# applied, and again whenever you change k8s/platform/ingress-nginx-values.yaml.
#
# Like app-deploy, this reaches the private cluster through
# `az aks command invoke` — the AKS run-command pod ships with both kubectl and
# helm, so no runner-side cluster credentials and no network route are needed.
#
# The chart is pulled ON THE RUNNER and uploaded to that pod as a .tgz, rather
# than having the in-cluster pod fetch it from kubernetes.github.io itself. The
# runner has plain internet access; a pod in a private cluster is exactly where
# an outbound chart download is least reliable. (The controller *image* is still
# pulled from registry.k8s.io by the node, which egresses via the AKS load
# balancer — that path is already proven by every other addon image.)
name: aks-platform-bootstrap

on:
  workflow_dispatch:
    inputs:
      uninstall:
        description: "Remove ingress-nginx instead of installing it"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-spoke-dev-vinorg-001' }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'aks-dev-lab-001' }}
  INGRESS_NGINX_VERSION: "4.12.0"

jobs:
  ingress-nginx:
    name: Internal ingress controller
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Uninstall
        if: ${{ inputs.uninstall }}
        run: |
          az aks command invoke \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --command "helm uninstall ingress-nginx --namespace ingress-nginx"

      # NOTE on quoting: everything inside --command is executed by a shell in
      # the run-command pod, so a bare newline would end the command. Each
      # invocation below is therefore a single line, chained with &&.
      # --file uploads into that pod's working directory, so helm refers to the
      # values file by its basename.
      - uses: azure/setup-helm@v4
        if: ${{ !inputs.uninstall }}

      # Runner-side download. The cluster never talks to kubernetes.github.io.
      - name: Fetch chart
        if: ${{ !inputs.uninstall }}
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm pull ingress-nginx/ingress-nginx --version "$INGRESS_NGINX_VERSION" --destination .

          # Upload both files from the workspace root so they land in the
          # run-command pod's working directory under predictable basenames.
          cp k8s/platform/ingress-nginx-values.yaml ./ingress-nginx-values.yaml
          ls -l ingress-nginx-*.tgz ingress-nginx-values.yaml

      - name: Install / upgrade
        if: ${{ !inputs.uninstall }}
        run: |
          chart="ingress-nginx-${INGRESS_NGINX_VERSION}.tgz"

          # Single line: everything inside --command runs in a shell in the
          # run-command pod, so a bare newline would terminate the command.
          az aks command invoke \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --command "helm upgrade --install ingress-nginx ./${chart} --namespace ingress-nginx --create-namespace --values ingress-nginx-values.yaml --wait --timeout 10m" \
            --file "$chart" \
            --file ingress-nginx-values.yaml

      # The private IP the internal load balancer allocated from
      # snet-aks-user-dev. This is the address you browse to from the mgmt VM.
      - name: Report the internal load balancer IP
        if: ${{ !inputs.uninstall }}
        run: |
          az aks command invoke \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --command "kubectl get ingressclass && kubectl -n ingress-nginx get svc ingress-nginx-controller -o wide"
