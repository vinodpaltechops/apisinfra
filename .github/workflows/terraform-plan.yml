# PR gate: plan each layer ONE BY ONE in dependency order (NOT in parallel).
# A dependent layer can only plan once its dependency's outputs already exist in
# remote state, so we keep the same linear chain as the deploy:
#
#   management-groups → policies → connectivity (hub) → dev
#
# apply: false everywhere — this only plans. Review the plans on the PR, then
# merge to main to run terraform-apply.yml (which plans AND applies in this order).
#
# NOTE: on a brand-new/empty environment, plan-only can't fully validate the
# chain (layer N+1 needs layer N *applied*, not just planned) — do the first
# deploy via terraform-apply.yml. On already-deployed infra this works because
# each dependency's state already exists.
name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  management-groups:
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/management-groups, apply: false }
    secrets: inherit

  policies:
    needs: management-groups
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/policies, apply: false }
    secrets: inherit

  connectivity:
    needs: policies
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/connectivity, apply: false }
    secrets: inherit

  dev:
    needs: connectivity
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/landing-zones/dev, apply: false }
    secrets: inherit
