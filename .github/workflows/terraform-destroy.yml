# TEARDOWN — the mirror image of terraform-deploy.yml.
#
# Destroy layers ONE BY ONE in the REVERSE of the deploy order, so each layer's
# dependency still exists (in state) while it is destroyed:
#
#   deploy :  management-groups → policies → connectivity (hub) → dev → appgw
#   destroy:  appgw → dev → connectivity (hub) → policies → management-groups
#
# The `needs:` chain forces sequential execution (no two layers at once). Using
# `terraform destroy` keeps state consistent — unlike deleting from the portal,
# which leaves the state drifted.
#
# Manual only (workflow_dispatch) + a typed "destroy" confirmation + the
# production-environment approval gate. Never runs on push/PR.
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down ALL layers'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Confirm teardown
    runs-on: ubuntu-latest
    environment: production # approval gate — add Required reviewers here
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "::error::You must type exactly 'destroy' to confirm."
            exit 1
          fi
          echo "Confirmed — destroying layers one by one, in reverse order."

  # ─────────────────────────────────────────────────────────────────────────────
  # DR LAYERS — destroyed FIRST, in reverse of the deploy order.
  #
  # TO REMOVE DR: comment out this block AND change the `dev` job below from
  #   needs: [appgw, dr]   back to   needs: appgw
  # That is the only other reference to these jobs. Leaving it pointing at a
  # commented-out job makes the whole workflow fail to parse.
  #
  # infra/platform/velero is DELIBERATELY ABSENT from this pipeline. It holds
  # the backup storage account, and destroying it deletes every backup — the one
  # thing a teardown must never take with it. Tear it down by hand, on purpose:
  #   terraform -chdir=infra/platform/velero destroy
  # ─────────────────────────────────────────────────────────────────────────────

  # 0a) Front Door — outermost. Before this runs, point app_fqdn back at the
  #     primary gateway's A record: destroying Front Door while the CNAME still
  #     targets its endpoint is a hard outage, not a graceful fallback.
  frontdoor:
    needs: guard
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/frontdoor, destroy: true }
    secrets: inherit

  # 0b) DR Application Gateway — holds a subnet in the DR spoke VNet, which the
  #     DR landing zone cannot delete while it is in use.
  appgw-dr:
    needs: frontdoor
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/appgw-dr, destroy: true }
    secrets: inherit

  # 0c) DR landing zone — before dev, because it reads dev's state (mgmt VM
  #     identity, shared ACR, jump VNet) and owns both halves of the
  #     jump↔DR-spoke peering.
  dr:
    needs: appgw-dr
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/landing-zones/dr, destroy: true }
    secrets: inherit

  # 1) Application Gateway — the outermost of the original layers, and it holds
  #    a subnet inside the hub VNet which connectivity cannot delete while that
  #    subnet is still in use.
  appgw:
    needs: guard
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/appgw, destroy: true }
    secrets: inherit

  # 2) Dev landing zone — waits on BOTH the primary gateway and the entire DR
  #    chain. The DR layer reads dev's state for the mgmt VM identity, the shared
  #    ACR and the jump VNet, and owns both halves of the jump↔DR-spoke peering.
  #    Destroying dev first would pull those out from under a DR layer that is
  #    still being destroyed.
  #
  #    Without the DR block above, this reverts to `needs: appgw`.
  dev:
    needs: [appgw, dr]
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/landing-zones/dev, destroy: true }
    secrets: inherit

  # 1b) Policies-DINE — optional; if deployed, destroy it here (before hub/MG,
  #     which it reads). Uncomment to enable.
  # policies-dine:
  #   needs: dev
  #   uses: ./.github/workflows/tf-layer.yml
  #   with: { layer_path: infra/platform/policies-dine, destroy: true }
  #   secrets: inherit

  # 2) Connectivity (hub) — after dev is gone (dev read the hub's state)
  connectivity:
    needs: dev
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/connectivity, destroy: true }
    secrets: inherit

  # 3) Policies — after hub; policies reads MG state, which still exists here
  policies:
    needs: connectivity
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/policies, destroy: true }
    secrets: inherit

  # 4) Management groups (destroyed last).
  #    WARNING: the subscription association has lifecycle { prevent_destroy =
  #    true }, so this job FAILS until you remove that guard in
  #    management-groups/main.tf. Destroying it does NOT delete your subscription
  #    — it just moves it back to the tenant root MG. (bootstrap is never here:
  #    it holds the state backend itself.)
  management-groups:
    needs: policies
    uses: ./.github/workflows/tf-layer.yml
    with: { layer_path: infra/platform/management-groups, destroy: true }
    secrets: inherit
